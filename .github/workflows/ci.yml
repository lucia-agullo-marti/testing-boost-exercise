name: CI

on:
  push:
    branches: [main, extend-tests]
  pull_request:
    branches: [main, extend-tests]

jobs:
  style:
    name: Style (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting (src, tests)
        run: |
          FILES=$(find src tests -type f \( -name "*.cpp" -o -name "*.hpp" \))
          clang-format --dry-run --Werror $FILES

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libeigen3-dev libboost-test-dev libyaml-cpp-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Archive build directory
        run: tar -czf build.tgz build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-tgz
          path: build.tgz
          retention-days: 1

  test:
    name: Test (ctest)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libeigen3-dev libboost-test-dev libyaml-cpp-dev

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-tgz

      - name: Unpack build directory
        run: tar -xzf build.tgz

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
